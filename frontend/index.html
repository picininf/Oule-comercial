<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover libera as env(safe-area-inset-*) do CSS, para o
         app não ficar por baixo do notch/barra de gestos no Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Painel de gestão financeira com Open Finance e assistente de comprovantes no WhatsApp." />
    <meta name="theme-color" content="#111827" />
    <!-- Dados financeiros não devem vazar pelo header Referer ao abrir
         links externos (ex.: a tela da Pluggy). -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Gestão Financeira</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
